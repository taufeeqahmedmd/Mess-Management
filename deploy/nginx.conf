# nginx reverse proxy for the mess-management app (single-box EC2, Option A).
# Place at /etc/nginx/sites-available/mess and symlink into sites-enabled,
# OR drop into /etc/nginx/conf.d/mess.conf (Amazon Linux).
#
# Replace mess.yourdomain.com with your real subdomain once DNS points here,
# then run:  sudo certbot --nginx -d mess.yourdomain.com
# certbot will fill in / manage the ssl_certificate lines and the :443 block.

upstream mess_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP: redirect everything to HTTPS -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mess.yourdomain.com;

    # Let certbot answer the ACME challenge over HTTP, redirect the rest.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: proxy to Next.js ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mess.yourdomain.com;

    # certbot manages these two lines (paths shown for reference):
    # ssl_certificate     /etc/letsencrypt/live/mess.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mess.yourdomain.com/privkey.pem;

    # CSV recharge import can be a sizeable upload — allow headroom.
    client_max_body_size 20m;

    # The service worker must never be cached, or counter clients get stuck on
    # an old version and miss offline-queue fixes.
    location = /sw.js {
        proxy_pass http://mess_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed build assets are immutable — cache them hard.
    location /_next/static/ {
        proxy_pass http://mess_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://mess_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # These two are what AUTH_TRUST_HOST relies on for correct callbacks:
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
