name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build does not connect to a DB, but Prisma reads the env var.
          DATABASE_URL: postgresql://mess:mess@localhost:5432/mess_management?schema=public
          AUTH_SECRET: ci-build-only-secret
