name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never let two deploys run at once; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build does not connect to a DB, but Prisma reads the env var.
          DATABASE_URL: postgresql://mess:mess@localhost:5432/mess_management?schema=public
          AUTH_SECRET: ci-build-only-secret

  # Deploy to the SSH/PM2 server, but only for pushes to main that passed `verify`
  # (pull_request events are skipped). Requires the repo secrets listed below.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (pull, build, reload PM2)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git reset --hard origin/main        # deploy box tracks main exactly; .env is gitignored so untouched
            npm ci
            npx prisma generate
            npx prisma migrate deploy           # applies any pending migrations; no-op if none
            npm run build
            pm2 reload "${{ secrets.PM2_APP_NAME }}" --update-env
            pm2 save
